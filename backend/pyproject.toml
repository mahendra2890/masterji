[project]
name = "masterji-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<6",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "djangorestframework-simplejwt>=5.3",
    "dj-database-url>=2.2",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.7",
    "gunicorn>=23.0",
    "google-auth>=2.34",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "litellm>=1.83",
    "tenacity>=9.1", # litellm's num_retries imports it lazily
    "loguru>=0.7.3",
    "opentelemetry-exporter-otlp>=1.41",
    "opentelemetry-instrumentation-django>=0.62b0",
    "opentelemetry-instrumentation-psycopg>=0.62b0",
    "opentelemetry-instrumentation-requests>=0.62b0",
    "boto3>=1.35",
    "redis>=5.2", # only imported when CACHE_URL is set — see settings.CACHES
    # Web push: the VAPID signature and the payload encryption, neither of
    # which is a thing to hand-roll. It brings `http-ece` and `py-vapid` with
    # it and reuses the `cryptography` already in this lock, so the added
    # weight on a 512MB box is two small pure-Python packages.
    "pywebpush>=2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15",
]

[tool.uv]
# A Django project, not an installable package — sync deps only.
package = false

# Enforced in CI — see the Lint step in .github/workflows/checks.yml.
#
# The rule set is narrow deliberately: `I` is import order and `F401` is unused
# imports. Both are mistakes rather than taste, both have exactly one correct
# answer, and both are things a reviewer would otherwise spend a comment on.
#
# `ruff format` is deliberately NOT part of the contract, and the reason is
# worth keeping because the question comes back every time somebody opens this
# file. It would reformat 62 of 153 files today, and what it would reformat is
# largely this codebase's memory: the long comment blocks that record why a
# rule is the way it is, wrapped and indented by hand where that made them
# readable. A formatter has opinions about those that no reviewer asked for.
#
# The gap also grows on its own — it was 50 files when this was measured on
# 3fbe679 and 62 on 2e376f3 — so "we'll adopt it once it's smaller" is not a
# plan. Adopting it means deciding to spend the sweep, in its own pull request,
# on a quiet moment with nothing else in flight. Until somebody decides that,
# `format` stays unrun rather than half-run.
[tool.ruff.lint]
select = ["I", "F401"]
