# Render Blueprint — deploys the Django API as a free Docker web service.
# In the Render dashboard: New → Blueprint → pick this repo. Values marked
# sync: false are prompted for at creation time (see DEPLOY.md).
#
# The database is NOT provisioned here on purpose: Render's free Postgres
# expires 30 days after creation. Use Neon (free, persistent) and paste its
# connection string as DATABASE_URL.

services:
  - type: web
    name: masterji-api
    runtime: docker
    plan: free
    region: singapore # closest to Neon ap-southeast-1
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      # Neon connection string (postgres://...?sslmode=require)
      - key: DATABASE_URL
        sync: false
      # https://masterji.mscsoftwares.in (+ the .vercel.app host)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      # Google OAuth (client must allow both callback URLs — see DEPLOY.md)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # The coach's brain: litellm model string + that provider's key
      - key: LLM_MODEL
        value: openai/gpt-5.4-mini
      - key: OPENAI_API_KEY
        sync: false
      # First-boot admin user
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Optional OpenTelemetry (no-op when unset)
      # - key: OTEL_EXPORTER_OTLP_ENDPOINT
      #   sync: false
      # - key: OTEL_EXPORTER_OTLP_API_KEY
      #   sync: false
      # Optional web push — the evening nudge (#87). Unset is the default and
      # turns the feature off end to end: the subscribe endpoint answers 503,
      # the app draws no control, the hourly job exits clean. Listed here
      # rather than only in DEPLOY.md so a fresh blueprint deploy can see what
      # it would be opting into; commented for the same reason the OTEL pair
      # above is, which is that prompting for four values nobody has yet is a
      # worse first run than not offering them.
      #
      # Generating the keypair is DEPLOY.md §8.1 — and read it rather than
      # reaching for `vapid --gen`, which produces a PEM that pywebpush will
      # not parse out of an environment variable.
      #
      # NUDGE_TOKEN also has to be set as a GitHub Actions repository secret,
      # with the same value, alongside API_URL. Setting it here alone leaves
      # the endpoint locked and the hourly tick unable to knock.
      # - key: VAPID_PUBLIC_KEY
      #   sync: false
      # - key: VAPID_PRIVATE_KEY
      #   sync: false
      # - key: VAPID_CONTACT
      #   sync: false
      # - key: NUDGE_TOKEN
      #   sync: false
      # ALLOWED_HOSTS also auto-trusts RENDER_EXTERNAL_HOSTNAME.
