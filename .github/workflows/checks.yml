# The checks this repo already ran by hand, run by something that cannot forget.
#
# Nothing here is a new rule. Every command below is one a session is already
# instructed to run before it pushes; what changes is that forgetting is no
# longer possible, and `main` is checked after a merge as well as before one.
#
# On `push: main` as well as on pull requests, and that second trigger is the
# load-bearing one — see the note on the leaf check below.
name: checks

# The third trigger is not a check. `schedule:` is the clock this deployment
# decided to have in #142, and it lands here — in the repo's one workflow file
# — rather than in a second one, because a scheduled workflow is a thing you
# want to find where the other triggers are.
#
# It fires the evening nudge (#87) and nothing else: the `nudges` job below is
# the only one that runs on it, and the two check jobs are skipped. That
# condition is load-bearing in both directions — without it the hourly tick
# would run the full test suite twenty-four times a day, which is most of a
# free account's minutes spent re-proving a commit nobody pushed.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Hourly, and the job picks who is due — NOT a job set for the hour the
    # nudge should arrive. #142 settled this: free-tier scheduled runs are
    # best-effort and slip by minutes to hours, so a workflow set for 21:00
    # delivers at a random time and teaches the builder that the hour was
    # decorative. Every hour, asking "whose evening has started and who still
    # owes a proof", degrades to "shortly after" — which is honest.
    #
    # :17 rather than :00 on GitHub's own advice: the top of the hour is when
    # every scheduled workflow on the platform queues at once, and the delay
    # this whole design is working around is worst there.
    - cron: "17 * * * *"
  # So the tick can be fired by hand — which is the only way to prove the
  # secrets are right, since a scheduled run cannot be triggered any other way
  # and the next one is up to an hour off. See DEPLOY.md §8.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The hourly tick gets its own lane. It shares `github.ref` with every push
  # to main, and a nudge queued behind a fifteen-minute test run is a nudge
  # arriving at 18:20 for an evening that started at 17:00 — the exact delay
  # the hourly design exists to avoid.
  group: checks-${{ github.ref }}-${{ github.event_name == 'schedule' && 'nudge' || 'checks' }}
  # Superseded pull-request runs are wasted minutes; a run on main is a record
  # of whether main is deployable and is never worth throwing away.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      # 3.13 to match backend/Dockerfile, which is what production runs.
      # Sessions locally resolve to whatever `requires-python = ">=3.13"`
      # allows — this tree's .venv is on 3.14 — so this is also the step that
      # would notice code that only works on the newer one.
      # Exact version, not a floating major: setup-uv stopped publishing the
      # `vN` alias after v7, so `@v10` does not resolve to anything.
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.13"
          enable-cache: true
          working-directory: backend

      # First, because it takes under a second and the tests take ninety —
      # and because a second leaf is the failure that stops main deploying
      # rather than merely failing.
      #
      # Worth being honest about what this catches on a pull request: two
      # sessions branching from the same main each hold exactly one leaf in
      # their own graph, so both pass here and collide only once both are
      # merged. The run on `push: main` is what sees that, after the fact.
      # Turning it into prevention needs "Require branches to be up to date
      # before merging" in branch protection, which forces the rebase that
      # makes the collision visible while it is still a pull request.
      - name: One migration leaf per app
        run: uv run python manage.py check_migration_leaf

      # Also under a second, so it sits with the leaf check ahead of the ninety
      # the tests take.
      #
      # This adds no rule. `[tool.ruff.lint] select = ["I", "F401"]` has been in
      # pyproject.toml all along and ruff has been a dev dependency all along;
      # what was missing was anything that ran it, which made it a tool that
      # looked like a guarantee and was not one. The whole cost of turning it
      # into one was a single misplaced import in coach/tests.py.
      #
      # Unqualified — `.`, not `coach/` — because the rest of the backend is
      # already clean at zero cost, and the error a linter is hired for is the
      # one nobody has written yet. Scoping this to the app that happened to
      # hold today's error would leave accounts/ and config/ unwatched.
      #
      # `check` only: `ruff format` is deliberately not part of the contract,
      # and pyproject.toml carries the reasoning next to the config it governs.
      - name: Lint
        run: uv run ruff check .

      # Unqualified, and the label is the thing worth explaining. `coach.tests`
      # hid the nine tests in `backend/accounts/tests.py` from every pull
      # request this repo has ever had, and they are not incidental coverage:
      # they pin a dead cookie returning 401 rather than 500, a token for an
      # unknown user, an expired access cookie reading as *signed out* rather
      # than *broken*. A regression in any of them signs every builder out and
      # looks like an outage.
      #
      # Measured on d5caec9: 374 tests with the label, 383 without. The nine
      # cost about three seconds, because the qualified run already pays for
      # the same database.
      - name: Tests
        run: uv run python manage.py test

  frontend:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run test:web

      # Runs TypeScript itself, which is why there is no separate tsc step:
      # it is the thing that catches a TSX break, and a second type pass would
      # be the same check billed twice.
      - run: npm run build

  # ---------------------------------------------------------------- the tick
  #
  # The whole of the clock this deployment has (#142). Ten lines of curl, and
  # every decision about WHO gets a nudge is on the other end of it, in
  # backend/coach/nudges.py — which is the property option 2 was chosen for:
  # the trigger is in the repo and reviewable, and the logic it triggers is
  # tested by the same suite as everything else rather than living in a cron
  # dashboard nobody reads.
  #
  # It is deliberately dumb. It knows an hour has passed and knows nothing
  # about evenings, timezones, or who declared what — the server owns all of
  # that, because the server is the thing with the rows.
  #
  # #96 (`CheckIn.due_hour`) rides this same tick when somebody joins them up.
  # The field landed while this was being built and is a record only — see the
  # note in coach/nudges.py for why joining it to the nudge is a product call
  # rather than a loose end. Either way it needs no second workflow and no
  # change here: a per-builder hour narrows the selection inside
  # `nudges.due_now`, and this job still just says "now".
  nudges:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Both secrets are set by hand and neither is optional — see DEPLOY.md
      # §8. Named here rather than left to fail inside curl, because the
      # failure without this check is a 401 on a 15-minute-old fork of the
      # repo, and the log would not say which of the two things was missing.
      #
      # A fork's scheduled runs get no secrets at all, which is why this is a
      # clean exit rather than a red X: nothing is wrong, this simply is not
      # the repo that holds the keys.
      - name: Check the tick is configured
        env:
          API_URL: ${{ secrets.API_URL }}
          NUDGE_TOKEN: ${{ secrets.NUDGE_TOKEN }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$NUDGE_TOKEN" ]; then
            echo "API_URL or NUDGE_TOKEN is not set — nothing to do."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
        id: config

      # `--max-time 120` because the API is on Render's free tier and sleeps
      # after 15 idle minutes: the first request of a quiet evening pays a
      # container start plus `migrate` on 0.1 CPU, which DEPLOY.md §2 measures
      # at about two minutes. A shorter timeout would make the nudge fail
      # precisely on the evenings nobody had opened the app — the ones it
      # exists for.
      #
      # `--fail-with-body` so a refusal is both a red X and a readable reason.
      # The body is a count of who was nudged, which is the only record of a
      # tick that anybody ever reads.
      - name: Nudge whoever is due
        if: steps.config.outputs.configured == 'true'
        env:
          API_URL: ${{ secrets.API_URL }}
          NUDGE_TOKEN: ${{ secrets.NUDGE_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 120 --retry 2 --retry-delay 10 \
            -X POST "$API_URL/api/coach/nudges/run/" \
            -H "X-Nudge-Token: $NUDGE_TOKEN" \
            -H "Content-Length: 0"
          echo
